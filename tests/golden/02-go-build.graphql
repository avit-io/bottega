container { from(address: "golang:1.25-alpine") { withMountedCache(path: "/go/pkg/mod", cache: "<cacheVolume(key: \"go-mod\")>") { withEnvVariable(name: "CGO_ENABLED", value: "0") { withDirectory(path: "/src", source: "<host { directory(path: \"cookbook/hello\") }>") { withWorkdir(path: "/src") { withExec(args: ["go", "build", "-o", "/out/hello", "."]) { directory(path: "/out") { export(path: "cookbook/bin", wipe: false) } } } } } } } }
